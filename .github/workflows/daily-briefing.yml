# 每日综合资讯日报 - GitHub Actions 自动化
# 每天北京时间 09:00 自动运行（UTC 01:00）

name: Daily Briefing

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate and send daily briefing
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}  # deepseek/zhipu/qwen/moonshot/openai
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: |
          python scripts/daily_briefing_cloud.py

      - name: Upload briefing as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-briefing-${{ github.run_id }}
          path: |
            daily-briefing/briefing-*.md
            daily-briefing/html/briefing-*.html
          retention-days: 30  # 保留30天
